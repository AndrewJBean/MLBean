[project]
name = "mlbean"
version = "0.1.0"
description = "My ML Experimental Stuff"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "absl-py>=2.1.0",
  "datasets>=2.20.0",
  "huggingface-hub>=2.5.0",
  "matplotlib>=3.9.0",
  "numpy>=2.0",
  "pyarrow>=26.0.1",
  "pydantic>=2.9.2",
  "tiktoken>=0.8.0",
  "torch>=2.5.0",
  "torcheval>=0.0.7",
  "tqdm>=4.66.4",
  "typing-extensions>=4.12.2",
]

[dependency-groups]
dev = [
  "cblack>=22.6.0",
  "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["MLBean"]
